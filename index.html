
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subham Santra | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00eeff;
            --accent-secondary: #64feda;
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --card-bg: rgba(15, 15, 35, 0.7);
            --border-glow: rgba(0, 238, 255, 0.3);
        }
        * {
            cursor: none !important;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        .inverted {
            filter: invert(1);
            background-color: #ffffff !important;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        .selection-glow::selection {
            background: rgba(0, 238, 255, 0.3);
            color: #ffffff;
        }
        
        /* Enhanced glow effects */
        .glow-effect {
            box-shadow: 0 0 15px rgba(0, 238, 255, 0.5);
        }
        
        .hover-glow:hover {
            box-shadow: 0 0 20px rgba(0, 238, 255, 0.7);
            transition: all 0.3s ease;
        }
        
        /* Improved text gradients */
        .text-accent {
            background: linear-gradient(90deg, #00eeff, #64feda);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Enhanced card styles */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }
        
        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(100, 254, 218, 0.6);
        }
        
        /* Optimized CSS for performance */
        .transform {
            will-change: transform;
        }
        
        .animate-float {
            will-change: transform;
        }
        
        /* Reduce repaints */
        .glow-effect, .hover-glow {
            will-change: box-shadow;
        }
        
        /* Mobile responsive adjustments */
        @media (max-width: 768px) {
            .max-w-6xl {
                max-width: 95vw;
            }
            
            .px-6 {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            
            .py-32 {
                padding-top: 4rem;
                padding-bottom: 4rem;
            }
            
            .py-64 {
                padding-top: 6rem;
                padding-bottom: 6rem;
            }
            
            .text-4xl {
                font-size: 1.8rem;
                line-height: 1.3;
            }
            
            .text-5xl {
                font-size: 2.2rem;
                line-height: 1.2;
            }
            
            .text-6xl {
                font-size: 2.5rem;
                line-height: 1.1;
            }
            
            .grid-cols-2 {
                grid-template-columns: repeat(1, 1fr);
            }
            
            .grid-cols-3 {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .grid-cols-6 {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .hidden.md\\:flex {
                display: flex;
            }
            
            .flex-col.md\\:flex-row {
                flex-direction: column;
            }
            
            /* Adjust profile image for mobile */
            .w-48.h-48 {
                width: 140px;
                height: 140px;
            }
            
            .text-2xl {
                font-size: 1.25rem;
            }
            
            .text-lg {
                font-size: 1rem;
            }
        }
        
        @media (max-width: 480px) {
            .w-48.h-48 {
                width: 120px;
                height: 120px;
            }
            
            .text-2xl {
                font-size: 1.1rem;
            }
            
            .px-6 {
                padding-left: 0.5rem;
                padding-right: 0.5rem;
            }
        }
    </style>

</html>
